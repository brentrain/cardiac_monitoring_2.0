<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICU Telemetry Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --ok: #3fb950;
      --warn: #d29922;
      --crit: #f85149;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.65rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .chip.crit { border-color: var(--crit); color: var(--crit); }
    .chip.warn { border-color: var(--warn); color: var(--warn); }
    .chip.ok { border-color: var(--ok); color: var(--ok); }
    main {
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .card.critical { border-color: var(--crit); box-shadow: 0 0 0 1px var(--crit); }
    .card.warning { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .card-header strong { font-size: 0.95rem; }
    .dx { font-size: 0.8rem; color: var(--muted); }
    .hr-block {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      margin: 0.25rem 0;
    }
    .hr-num {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hr-num.ok { color: var(--ok); }
    .hr-num.warning { color: var(--warn); }
    .hr-num.critical { color: var(--crit); }
    .hr-label { font-size: 0.75rem; color: var(--muted); }
    .vitals-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.35rem 0.75rem;
      font-size: 0.8rem;
    }
    .vitals-row span { color: var(--muted); }
    .bar-wrap {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 2px;
    }
    .bar-spo2 {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .pills { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .pill {
      font-size: 0.68rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .pill.rhythm { border-color: var(--accent); color: var(--accent); }
    .pill.artifact { border-color: #a371f7; color: #c9b3ff; }
    .reasons {
      font-size: 0.72rem;
      color: var(--warn);
      line-height: 1.35;
    }
    .reasons.critical { color: var(--crit); }
    canvas.spark { width: 100%; height: 44px; display: block; }
    .banner-err {
      display: none;
      padding: 0.75rem 1rem;
      background: #3d2121;
      color: #ffb4b4;
      font-size: 0.85rem;
    }
    .banner-err.show { display: block; }
    .ecg-wrap {
      margin-top: 0.35rem;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #1e3d2e;
    }
    .ecg-label {
      font-size: 0.62rem;
      color: #6e9b7c;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
      background: #0a120e;
      border-bottom: 1px solid #1e3d2e;
    }
    canvas.ecg-strip {
      width: 100%;
      height: 76px;
      display: block;
      background: #0a120e;
    }
    canvas.spark { margin-top: 0.15rem; }
    .btn-hil {
      font-size: 0.68rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .btn-hil:hover { border-color: var(--accent); color: var(--accent); }
    .btn-hil.ack { border-color: var(--accent); color: var(--accent); }
    .btn-hil.ack:hover { background: rgba(88, 166, 255, 0.1); }
    .btn-report {
      font-size: 0.78rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
    }
    .btn-report:hover { background: rgba(88, 166, 255, 0.12); }
    .btn-reset {
      font-size: 0.72rem;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .btn-reset:hover { border-color: var(--warn); color: var(--warn); }
    .rhythm-adj {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }
    .rhythm-adj .hil-rhythm-select {
      flex: 1 1 120px;
      min-width: 100px;
      max-width: 200px;
      font-size: 0.65rem;
      padding: 0.18rem 0.25rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .btn-hil.compact {
      font-size: 0.62rem;
      padding: 0.18rem 0.4rem;
    }
    .pill.monitor { border-color: var(--muted); color: var(--muted); }
    .pill.human-true { border-color: var(--ok); color: var(--ok); }
    .report-toast {
      display: none;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      background: #0d2818;
      border: 1px solid var(--ok);
      border-radius: 6px;
      color: #b4f0c4;
      white-space: pre-wrap;
    }
    .report-toast.show { display: block; }
    .alarm-row {
      margin-top: 0.35rem;
      padding-top: 0.45rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .alarm-line {
      font-size: 0.72rem;
      color: var(--text);
      line-height: 1.4;
    }
    .alarm-meta {
      display: block;
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-top: 0.15rem;
    }
    .alarm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
    }
    .btn-hil.alarm-pick-real.alarm-picked {
      box-shadow: 0 0 0 1px var(--accent);
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-hil.alarm-pick-fake.alarm-picked {
      box-shadow: 0 0 0 1px var(--warn);
      border-color: var(--warn);
      color: var(--warn);
    }
  </style>
</head>
<body>
  <div id="load-err" class="banner-err">Could not reach the backend. Start the server: <code>python icu_telemetry_server.py</code></div>
  <header>
    <div class="header-row">
      <h1>ICU Telemetry</h1>
      <span class="meta" id="clock"></span>
      <span class="meta">Sim step: <strong id="step">—</strong></span>
      <button type="button" class="btn-report" id="btn-report" title="Writes a text report only when you ask; uses your triage labels">Generate clinician report (on demand)</button>
      <button type="button" class="btn-reset" id="btn-session-reset" title="Clears human triage / 'cache' and starts a fresh simulator run">Reset session</button>
      <span class="meta" id="sim-profile"></span>
    </div>
    <div class="header-row">
      <div class="chips">
        <span class="chip crit" id="chip-crit">Critical: 0</span>
        <span class="chip warn" id="chip-warn">Watch: 0</span>
        <span class="chip ok" id="chip-events">Events: 0</span>
      </div>
      <div class="chips" id="hil-chips">
        <span class="chip warn" id="chip-hil-bed">Beds need rhythm review: —</span>
        <span class="chip ok" id="chip-hil-ev">Events triaged: —</span>
      </div>
    </div>
    <div id="report-toast" class="report-toast" role="status"></div>
  </header>
  <main>
    <section class="grid" id="patients"></section>
  </main>
  <script>
    /** Latest patient payloads keyed by id — updated by poll; rAF reads for smooth ECG scroll */
    let latestById = {};

    const BEAT_KNOTS = [
      [0, 0], [0.06, 0], [0.085, 0.14], [0.11, 0], [0.17, -0.06], [0.195, 1.75], [0.218, -0.32],
      [0.27, 0], [0.32, 0], [0.38, 0.22], [0.52, 0], [0.78, 0], [1, 0],
    ];

    function fract(x) {
      return x - Math.floor(x);
    }

    function interpBeat(phi) {
      phi = fract(phi);
      for (let i = 0; i < BEAT_KNOTS.length - 1; i++) {
        const a = BEAT_KNOTS[i];
        const b = BEAT_KNOTS[i + 1];
        if (phi >= a[0] && phi <= b[0]) {
          if (b[0] === a[0]) return a[1];
          const t = (phi - a[0]) / (b[0] - a[0]);
          return a[1] * (1 - t) + b[1] * t;
        }
      }
      return 0;
    }

    function interpBeatWide(phi) {
      const ph = fract(phi);
      const u = ph < 0.78 ? (ph / 0.78) : (ph - 0.78) / 0.22;
      return interpBeat(u) * 1.15;
    }

    /** Smooth beat built from Gaussian P, Q, R, S, and T components (phi in one cycle, 0 to 1). */
    function gaussPulse(x, mu, sigma) {
      const d = (x - mu) / sigma;
      return Math.exp(-d * d);
    }

    function beatShape(phi, opts) {
      const ph = fract(phi);
      const withP = !(opts && opts.withP === false);
      const wide = !!(opts && opts.wide);
      const p = withP ? 0.12 * gaussPulse(ph, 0.09, 0.022) : 0;
      const q = -0.12 * gaussPulse(ph, 0.175, 0.008);
      const r = (wide ? 0.95 : 1.0) * gaussPulse(ph, 0.2, wide ? 0.022 : 0.012);
      const s = -0.22 * gaussPulse(ph, 0.225, 0.01);
      const t = 0.26 * gaussPulse(ph, 0.38, 0.055);
      return p + q + r + s + t;
    }

    /** Beat position carried forward in time, so a heart rate change does not jump the trace. */
    const phaseAnchors = new Map();

    function updatePhaseAnchors(patients) {
      const nowSec = performance.now() / 1000;
      for (const p of patients) {
        const bps = Math.max(0, p.vitals.heartRate) / 60;
        const list = phaseAnchors.get(p.id);
        if (!list) {
          phaseAnchors.set(p.id, [{ t0: nowSec, ph0: 0, bps: bps }]);
          continue;
        }
        const last = list[list.length - 1];
        if (Math.abs(bps - last.bps) > 0.002) {
          const ph0 = last.ph0 + (nowSec - last.t0) * last.bps;
          list.push({ t0: nowSec, ph0: ph0, bps: bps });
          if (list.length > 300) list.shift();
        }
      }
    }

    function phaseAt(id, tSec) {
      const list = phaseAnchors.get(id);
      if (!list || !list.length) return 0;
      let a = list[0];
      for (let i = list.length - 1; i >= 0; i--) {
        if (list[i].t0 <= tSec) { a = list[i]; break; }
      }
      return a.ph0 + (tSec - a.t0) * a.bps;
    }

    /** Deterministic pseudo-random value in [0, 1) for beat index k. */
    function hash01(k, seed) {
      const x = Math.sin(k * 12.9898 + seed * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    /** Beat start positions (in cycles) jitter around whole cycles so R-R intervals vary, as in AFib. */
    function afBeatStart(k, seed) {
      return k + (hash01(k, seed) - 0.5) * 0.7;
    }

    /** Find the beat containing cycle position P and return its phase (0 to 1) within that beat. */
    function afBeatAt(P, seed) {
      let k = Math.floor(P) - 2;
      while (afBeatStart(k + 1, seed) <= P) k++;
      const start = afBeatStart(k, seed);
      const end = afBeatStart(k + 1, seed);
      return { k: k, phase: (P - start) / (end - start) };
    }

    /** Fine fibrillatory baseline (about 4 to 7 per second), in place of P waves. */
    function afFibrillatoryWave(tSec, seed) {
      return 0.035 * Math.sin(2 * Math.PI * 5.3 * tSec + seed) +
             0.025 * Math.sin(2 * Math.PI * 6.9 * tSec + seed * 1.3) +
             0.012 * noise1(tSec * 9, seed);
    }

    function rhythmMode(name) {
      const map = {
        "Normal Sinus Rhythm": "nsr",
        "Sinus Tachycardia": "tach",
        "Sinus Bradycardia": "brady",
        Tachycardia: "tach",
        Bradycardia: "brady",
        Asystole: "asy",
        "Ventricular Fibrillation": "vf",
        "Atrial Fibrillation": "afib",
        PVCs: "pvc",
      };
      return map[name] || "nsr";
    }

    function noise1(t, seed) {
      return Math.sin(t * 17.23 + seed * 1.7) * 0.5 + Math.sin(t * 43.11 + seed * 2.3) * 0.35;
    }

    function sampleEcg(tSec, p) {
      const rhythmLabel = p.displayRhythm || p.rhythm;
      const hr = Math.max(0, p.vitals.heartRate);
      const mode = rhythmMode(rhythmLabel);
      const seed = p.id * 9.17;

      if (hr <= 0 || mode === "asy") {
        return noise1(tSec, seed) * 0.018;
      }

      const bps = hr / 60;

      if (mode === "vf") {
        const chaos =
          noise1(tSec * 2.8, seed) * 0.58 +
          noise1(tSec * 5.1 + 1, seed + 1) * 0.38 +
          Math.sin(tSec * 61.3 + seed) * 0.07;
        return chaos * 0.92;
      }

      if (mode === "afib") {
        // Irregularly irregular beats, no P waves, fine fibrillatory baseline.
        const b = afBeatAt(phaseAt(p.id, tSec), seed);
        return beatShape(b.phase, { withP: false }) * 0.9 + afFibrillatoryWave(tSec, seed);
      }

      if (mode === "pvc") {
        const P = phaseAt(p.id, tSec);
        const wide = Math.floor(P) % 5 === 3;
        return beatShape(fract(P), { wide: wide });
      }

      return beatShape(fract(phaseAt(p.id, tSec)));
    }

    function drawEcgStrip(canvas, p) {
      const ctx = canvas.getContext("2d");
      const dpr = devicePixelRatio || 1;
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      if (cw <= 0 || ch <= 0) return;
      const w = (canvas.width = cw * dpr);
      const h = (canvas.height = ch * dpr);
      ctx.fillStyle = "#0a120e";
      ctx.fillRect(0, 0, w, h);

      const major = dpr * 12;
      ctx.strokeStyle = "rgba(74, 222, 128, 0.07)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= w; x += major) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y <= h; y += major) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      const scroll = performance.now() / 1000;
      const windowSec = 5;
      const st = p.status;
      let line = "#4ade80";
      if (st === "warning") line = "#fbbf24";
      if (st === "critical") line = "#f87171";

      ctx.strokeStyle = line;
      ctx.lineWidth = 1.35 * dpr;
      ctx.lineJoin = "round";
      ctx.beginPath();
      const midY = h * 0.52;
      const amp = h * 0.26;
      for (let i = 0; i <= w; i += 1.5 * dpr) {
        const t = scroll - ((w - i) / w) * windowSec;
        const volt = sampleEcg(t, p);
        const x = i;
        const y = midY - volt * amp;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function ecgAnimationLoop() {
      requestAnimationFrame(ecgAnimationLoop);
      document.querySelectorAll("canvas.ecg-strip").forEach((canvas) => {
        const id = +canvas.dataset.patientId;
        const pt = latestById[id];
        if (pt) drawEcgStrip(canvas, pt);
      });
    }
    requestAnimationFrame(ecgAnimationLoop);

    let rhythmOptionList = [];
    /** Per-bed draft for alarm triage before Save { eventIndex, verdict }. */
    const alarmDraft = {};

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }

    async function postAdjudicatePatient(patientId, action, humanRhythm) {
      const body = { patientId, action };
      if (humanRhythm) body.humanRhythm = humanRhythm;
      try {
        const r = await fetch("/api/adjudicate/patient", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          cache: "no-store",
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          alert(j.error || "Rhythm update failed (HTTP " + r.status + ").");
          return;
        }
        await tick();
      } catch (e) {
        alert("Could not reach server for rhythm update: " + (e.message || e));
      }
    }

    async function postAdjudicateEvent(eventIndex, verdict) {
      try {
        const r = await fetch("/api/adjudicate/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ eventIndex, verdict }),
          cache: "no-store",
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          alert(j.error || "Alert triage failed (HTTP " + r.status + ").");
          return false;
        }
        await tick();
        return true;
      } catch (e) {
        alert("Could not reach server for alert triage: " + (e.message || e));
        return false;
      }
    }

    document.getElementById("patients").addEventListener("click", (ev) => {
      const t = ev.target;
      if (!(t instanceof HTMLElement)) return;

      const pick = t.closest("[data-alarm-pick]");
      if (pick) {
        const pid = +pick.dataset.patientId;
        const draft = alarmDraft[pid];
        if (!draft) return;
        const v = pick.dataset.alarmPick;
        draft.verdict = v === "real" ? "confirmed_clinical" : "false_alarm_noise";
        const row = pick.closest(".alarm-row");
        if (row) {
          row.querySelectorAll("[data-alarm-pick]").forEach((b) => b.classList.remove("alarm-picked"));
          pick.classList.add("alarm-picked");
        }
        return;
      }

      const saveBtn = t.closest("[data-alarm-save]");
      if (saveBtn) {
        const pid = +saveBtn.dataset.patientId;
        const draft = alarmDraft[pid];
        if (!draft || !draft.verdict) {
          alert("Choose whether the alarm is true or not true, then press Save.");
          return;
        }
        postAdjudicateEvent(draft.eventIndex, draft.verdict).then((ok) => {
          if (ok) delete alarmDraft[pid];
        });
        return;
      }

      const cMon = t.closest("[data-hil=\"confirm-monitor\"]");
      if (cMon) {
        postAdjudicatePatient(+cMon.dataset.patientId, "confirm_monitor");
        return;
      }
      const clr = t.closest("[data-hil=\"clear-bed\"]");
      if (clr) {
        postAdjudicatePatient(+clr.dataset.patientId, "clear");
        return;
      }
      const corr = t.closest("[data-hil=\"correct-rhythm\"]");
      if (corr) {
        const card = corr.closest(".card");
        const sel = card && card.querySelector(".hil-rhythm-select");
        const val = sel && sel.value;
        if (!val) {
          alert("Choose the rhythm you believe is clinically true.");
          return;
        }
        postAdjudicatePatient(+corr.dataset.patientId, "correct_rhythm", val);
      }
    });

    document.getElementById("btn-session-reset").addEventListener("click", async () => {
      if (
        !confirm(
          "Reset session? This clears all human triage and starts a new simulation (fresh event log)."
        )
      ) {
        return;
      }
      try {
        const r = await fetch("/api/session/reset", { method: "POST" });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || "reset failed");
        for (const k of Object.keys(alarmDraft)) delete alarmDraft[k];
        tick();
      } catch (e) {
        alert("Session reset failed: " + (e.message || e));
      }
    });

    document.getElementById("btn-report").addEventListener("click", async () => {
      const toast = document.getElementById("report-toast");
      toast.classList.remove("show");
      try {
        const r = await fetch("/api/report/generate", { method: "POST" });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || "report failed");
        toast.textContent = `Report saved: ${j.filename} (${j.characters} characters). Check the QCC folder next to the server.`;
        toast.classList.add("show");
      } catch (e) {
        toast.textContent = "Could not generate report: " + e.message;
        toast.classList.add("show");
      }
    });

    function spo2Class(v) {
      if (v < 90) return "critical";
      if (v < 92) return "warning";
      return "ok";
    }
    function drawSpark(canvas, values, color) {
      const ctx = canvas.getContext("2d");
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      if (!values || values.length < 2) return;
      const min = Math.min(...values);
      const max = Math.max(...values);
      const pad = 4 * devicePixelRatio;
      const span = (max - min) || 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5 * devicePixelRatio;
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = pad + (i / (values.length - 1)) * (w - 2 * pad);
        const y = h - pad - ((v - min) / span) * (h - 2 * pad);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
    function hrClass(status, hr) {
      if (status === "critical") return "critical";
      if (status === "warning") return "warning";
      return "ok";
    }

    function renderPatient(p, bedEvents) {
      const v = p.vitals;
      const st = p.status;
      const review = p.humanReview || {};
      const pendingEvents = bedEvents.filter(
        (ev) => (ev.humanVerdict || "pending") === "pending"
      );
      const latestPending =
        pendingEvents.length > 0
          ? pendingEvents.reduce((a, b) => (a.eventIndex > b.eventIndex ? a : b))
          : null;

      if (!latestPending) {
        delete alarmDraft[p.id];
      } else {
        const d = alarmDraft[p.id];
        if (!d || d.eventIndex !== latestPending.eventIndex) {
          alarmDraft[p.id] = { eventIndex: latestPending.eventIndex, verdict: null };
        }
      }
      const ad = alarmDraft[p.id];
      const realPicked = !!(ad && ad.verdict === "confirmed_clinical");
      const fakePicked = !!(ad && ad.verdict === "false_alarm_noise");

      const card = document.createElement("article");
      card.className = "card" + (st === "critical" ? " critical" : st === "warning" ? " warning" : "");
      const reasons = (p.statusReasons || []).join(" · ");
      const spo2c = spo2Class(v.spo2);
      const barW = Math.min(100, Math.max(0, v.spo2));
      const hrLine = v.heartRate === 0 ? "—" : String(Math.round(v.heartRate));

      const humanPill =
        review.rhythmAgreesWithMonitor === true
          ? `<span class="pill human-true">Human: confirms monitor</span>`
          : "";
      const correctPill = review.humanRecordedRhythm
        ? `<span class="pill human-true">Human true: ${escapeHtml(review.humanRecordedRhythm)}</span>`
        : "";

      card.innerHTML = `
        <div class="card-header">
          <div>
            <strong>${escapeHtml(p.displayId)} · ${escapeHtml(p.name)}</strong>
            <div class="dx">${escapeHtml(String(p.age))} y · ${escapeHtml(p.diagnosis)}</div>
          </div>
        </div>
        <div class="hr-block">
          <span class="hr-num ${hrClass(st, v.heartRate)}">${hrLine}</span>
          <span class="hr-label">HR (bpm)</span>
        </div>
        <div class="vitals-row">
          <div>BP <strong>${Math.round(v.systolicBP)}/${Math.round(v.diastolicBP)}</strong></div>
          <div>RR <strong>${Math.round(v.respiratoryRate)}</strong> <span>/min</span></div>
          <div style="grid-column:1/-1">SpO₂ <strong>${v.spo2.toFixed(1)}%</strong>
            <div class="bar-wrap"><div class="barSpo2 bar-spo2" style="width:${barW}%"></div></div>
          </div>
          <div>T <strong>${v.temperature.toFixed(1)}</strong> <span>°C</span></div>
        </div>
        <div class="pills">
          <span class="pill monitor" title="Automated / monitor interpretation">Monitor: ${escapeHtml(p.rhythm)}</span>
          ${humanPill}
          ${correctPill}
          ${p.artifact ? `<span class="pill artifact">${escapeHtml(p.artifact)}</span>` : ""}
        </div>
        ${reasons ? `<div class="reasons ${st === "critical" ? "critical" : ""}">${escapeHtml(reasons)}</div>` : ""}
        <div class="ecg-wrap">
          <div class="ecg-label">ECG strip · ${escapeHtml(p.displayRhythm || p.rhythm)}</div>
          <canvas class="ecg-strip" data-patient-id="${p.id}"></canvas>
        </div>
        <canvas class="spark" data-spark="hr"></canvas>
        ${
          latestPending
            ? `<div class="alarm-row" data-patient-id="${p.id}">
          <div class="alarm-line">${escapeHtml(latestPending.description)}
            <span class="alarm-meta">${escapeHtml(latestPending.timestamp)} · ${escapeHtml(
              String(latestPending.type).replace(/_/g, " ")
            )}</span>
          </div>
          <div class="alarm-actions">
            <button type="button" class="btn-hil compact alarm-pick-real${
              realPicked ? " alarm-picked" : ""
            }" data-alarm-pick="real" data-patient-id="${p.id}" title="You acknowledge this alarm and judge it clinically true">Alarm is true</button>
            <button type="button" class="btn-hil compact alarm-pick-fake${
              fakePicked ? " alarm-picked" : ""
            }" data-alarm-pick="notreal" data-patient-id="${p.id}" title="You acknowledge this alarm and judge it not clinically true">Alarm is not true</button>
            <button type="button" class="btn-hil compact primary" data-alarm-save data-patient-id="${p.id}" title="Submit your decision to the server">Save decision</button>
          </div>
        </div>`
            : ""
        }
        <div class="rhythm-adj">
          <button type="button" class="btn-hil compact primary" data-hil="confirm-monitor" data-patient-id="${p.id}" title="Confirm monitor rhythm read is clinically acceptable">✓ OK</button>
          <select class="hil-rhythm-select" aria-label="True rhythm if monitor is wrong"></select>
          <button type="button" class="btn-hil compact" data-hil="correct-rhythm" data-patient-id="${p.id}" title="Apply selected rhythm as human-recorded truth">Set</button>
          <button type="button" class="btn-hil compact" data-hil="clear-bed" data-patient-id="${p.id}" title="Clear rhythm adjudication for this bed">Clear</button>
        </div>
      `;

      const sel = card.querySelector(".hil-rhythm-select");
      if (sel) {
        const ph = document.createElement("option");
        ph.value = "";
        ph.textContent = "If wrong, select true rhythm…";
        sel.appendChild(ph);
        rhythmOptionList.forEach((label) => {
          const o = document.createElement("option");
          o.value = label;
          o.textContent = label;
          sel.appendChild(o);
        });
      }

      const bar = card.querySelector(".barSpo2");
      if (bar) {
        bar.style.background = spo2c === "critical" ? "var(--crit)" : spo2c === "warning" ? "var(--warn)" : "var(--ok)";
      }
      const c = card.querySelector("canvas.spark");
      requestAnimationFrame(() => {
        const col = st === "critical" ? "#f85149" : st === "warning" ? "#d29922" : "#3fb950";
        drawSpark(c, p.hrTrend, col);
      });
      return card;
    }
    async function tick() {
      const err = document.getElementById("load-err");
      try {
        const r = await fetch("/api/snapshot", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        rhythmOptionList = data.rhythmOptions || [];
        latestById = Object.fromEntries(data.patients.map((x) => [x.id, x]));
        updatePhaseAnchors(data.patients);
        err.classList.remove("show");
        document.getElementById("step").textContent = data.timeStep;
        document.getElementById("chip-crit").textContent = "Critical beds: " + data.stats.patientsCritical;
        document.getElementById("chip-warn").textContent = "Watch: " + data.stats.patientsWarning;
        document.getElementById("chip-events").textContent = "Events logged: " + data.stats.totalEvents;
        const h = data.stats.hil || {};
        document.getElementById("chip-hil-bed").textContent =
          "Beds pending rhythm review: " + (h.bedsPendingRhythmReview ?? "—");
        const tri =
          (h.eventsConfirmedClinical || 0) +
          (h.eventsSuppressedNoise || 0) +
          (h.eventsAcknowledged || 0);
        document.getElementById("chip-hil-ev").textContent =
          "Events triaged: " +
          tri +
          " (ack " +
          (h.eventsAcknowledged || 0) +
          ") · still awaiting: " +
          (h.eventsAwaitingReview ?? "—");
        const prof = document.getElementById("sim-profile");
        if (prof) {
          const sp = (data.stats && data.stats.simProfile) || {};
          prof.textContent = sp.sinusRhythmVariantsOnly
            ? "Simulation: NSR, sinus tach/brady, and atrial fibrillation only."
            : "";
        }
        const root = document.getElementById("patients");
        root.innerHTML = "";
        const sorted = [...data.patients].sort((a, b) => a.id - b.id);
        sorted.forEach((p) =>
          root.appendChild(
            renderPatient(
              p,
              data.events.filter((ev) => ev.patientId === p.id)
            )
          )
        );
      } catch {
        err.classList.add("show");
      }
    }
    function clock() {
      document.getElementById("clock").textContent = new Date().toLocaleString();
    }
    clock();
    setInterval(clock, 1000);
    tick();
    setInterval(tick, 800);
  </script>
</body>
</html>
